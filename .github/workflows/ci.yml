name: Build, typecheck and browser tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: CI gate 1 · motion-kit import smoke and release script syntax
        run: |
          npm run check:pkg
          node --check scripts/verify-production.mjs
      - name: Typecheck and build (stages demo into dist/)
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: CI gate 2+3 · app and demo interaction tests (console-clean)
        run: npm run test:e2e
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-screenshots
          path: |
            test-results/**/*.png
            test-results/**/benchmark.json
          if-no-files-found: ignore
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-dist
          path: dist/

  export-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build and run generated Vue and React projects, validate ZIP
        run: node scripts/verify-exports.mjs
